name: Weekly NFL Scoring

on:
  schedule:
    # Monday 8am ET (13:00 UTC) - captures data through Sunday, MNF teams excluded
    - cron: '0 13 * * 1'
    # Tuesday 8am ET (13:00 UTC) - re-run with completed MNF result included
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (e.g. 2026)'
        required: true
      week:
        description: 'Week number'
        required: true

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn

      - name: DEBUG list files
        run: ls -la

      - name: Determine current NFL week
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "season=${{ github.event.inputs.season }}" >> $GITHUB_OUTPUT
            echo "week=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            # Simple heuristic: NFL season starts early September; adjust the
            # reference date each year, or replace with a proper schedule
            # lookup if this drifts. Uses plain bash/date arithmetic (not
            # embedded Python) to avoid indentation-sensitivity issues when
            # this block is embedded inside YAML.
            today_epoch=$(date -u +%s)
            year=$(date -u +%Y)
            month=$(date -u +%-m)
            if [ "$month" -lt 8 ]; then
              season=$((year - 1))
            else
              season=$year
            fi
            season_start_epoch=$(date -u -d "${season}-09-04" +%s)
            days_in=$(( (today_epoch - season_start_epoch) / 86400 ))
            week=$(( days_in / 7 + 1 ))
            if [ "$week" -lt 1 ]; then week=1; fi
            if [ "$week" -gt 18 ]; then week=18; fi
            echo "season=$season" >> $GITHUB_OUTPUT
            echo "week=$week" >> $GITHUB_OUTPUT
          fi

      - name: Run scorer (current week)
        run: python3 score_week.py --season ${{ steps.week.outputs.season }} --week ${{ steps.week.outputs.week }}

      - name: Run scorer (next week, kept populated in advance)
        run: python3 score_week.py --season ${{ steps.week.outputs.season }} --week $(( ${{ steps.week.outputs.week }} + 1 ))
        continue-on-error: true  # next week's schedule may not exist yet late in a season

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Weekly update: Season ${{ steps.week.outputs.season }} Week ${{ steps.week.outputs.week }} (+ next week)"
          git push
